name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/antitheft/tracker
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AntiTheftTracker"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.antitheft.tracker'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.antitheft.tracker'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Anti-Theft Tracker</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".LocationService"
                      android:foregroundServiceType="location"
                      android:exported="false" />

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1565C0</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/antitheft/tracker/MainActivity.java <<'EOF'
          package com.antitheft.tracker;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.view.ViewGroup;

          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          public class MainActivity extends android.app.Activity {

              EditText serverUrl;
              EditText deviceId;
              EditText deviceSecret;
              TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(35, 40, 35, 35);

                  TextView title = new TextView(this);
                  title.setText("Anti-Theft Tracker");
                  title.setTextSize(28);
                  title.setPadding(0, 0, 0, 25);
                  layout.addView(title);

                  TextView info = new TextView(this);
                  info.setText("নিজের ফোনের অবস্থান নিরাপদভাবে ট্র্যাক করার জন্য সেটআপ করুন।");
                  info.setTextSize(16);
                  layout.addView(info);

                  serverUrl = new EditText(this);
                  serverUrl.setHint("Server URL");
                  serverUrl.setText("https://anti-theft-tracker-1.onrender.com");
                  layout.addView(serverUrl);

                  deviceId = new EditText(this);
                  deviceId.setHint("Device ID");
                  deviceId.setText("my-phone");
                  layout.addView(deviceId);

                  deviceSecret = new EditText(this);
                  deviceSecret.setHint("Device Secret");
                  layout.addView(deviceSecret);

                  Button start = new Button(this);
                  start.setText("TRACKING চালু করুন");
                  layout.addView(start);

                  Button stop = new Button(this);
                  stop.setText("TRACKING বন্ধ করুন");
                  layout.addView(stop);

                  status = new TextView(this);
                  status.setText("Status: বন্ধ");
                  status.setTextSize(17);
                  status.setPadding(0, 25, 0, 0);
                  layout.addView(status);

                  setContentView(layout);

                  start.setOnClickListener(v -> startTracking());
                  stop.setOnClickListener(v -> stopTracking());
              }

              private void startTracking() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED) {

                      if (Build.VERSION.SDK_INT >= 33) {
                          ActivityCompat.requestPermissions(
                                  this,
                                  new String[]{
                                          Manifest.permission.ACCESS_FINE_LOCATION,
                                          Manifest.permission.ACCESS_COARSE_LOCATION,
                                          Manifest.permission.POST_NOTIFICATIONS
                                  },
                                  100
                          );
                      } else {
                          ActivityCompat.requestPermissions(
                                  this,
                                  new String[]{
                                          Manifest.permission.ACCESS_FINE_LOCATION,
                                          Manifest.permission.ACCESS_COARSE_LOCATION
                                  },
                                  100
                          );
                      }
                      return;
                  }

                  getPreferences(MODE_PRIVATE)
                          .edit()
                          .putString("server", serverUrl.getText().toString().trim())
                          .putString("device", deviceId.getText().toString().trim())
                          .putString("secret", deviceSecret.getText().toString().trim())
                          .apply();

                  Intent intent = new Intent(this, LocationService.class);

                  if (Build.VERSION.SDK_INT >= 26) {
                      startForegroundService(intent);
                  } else {
                      startService(intent);
                  }

                  status.setText("Status: Tracking চালু হয়েছে");
              }

              private void stopTracking() {
                  stopService(new Intent(this, LocationService.class));
                  status.setText("Status: Tracking বন্ধ");
              }
          }
          EOF

          cat > app/src/main/java/com/antitheft/tracker/LocationService.java <<'EOF'
          package com.antitheft.tracker;

          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.os.Build;
          import android.os.IBinder;

          import org.json.JSONObject;

          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class LocationService extends Service {

              private LocationManager locationManager;

              @Override
              public void onCreate() {
                  super.onCreate();

                  createNotificationChannel();

                  Notification notification =
                          new Notification.Builder(this, "tracker")
                                  .setContentTitle("Anti-Theft Tracker")
                                  .setContentText("Location tracking is active")
                                  .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                                  .setOngoing(true)
                                  .build();

                  startForeground(10, notification);

                  startLocation();
              }

              private void startLocation() {

                  if (Build.VERSION.SDK_INT >= 23 &&
                          checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                                  != PackageManager.PERMISSION_GRANTED &&
                          checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION)
                                  != PackageManager.PERMISSION_GRANTED) {
                      return;
                  }

                  locationManager =
                          (LocationManager) getSystemService(Context.LOCATION_SERVICE);

                  LocationListener listener = new LocationListener() {
                      @Override
                      public void onLocationChanged(Location location) {
                          sendLocation(location);
                      }
                  };

                  try {
                      locationManager.requestLocationUpdates(
                              LocationManager.GPS_PROVIDER,
                              30000,
                              10,
                              listener
                      );

                      locationManager.requestLocationUpdates(
                              LocationManager.NETWORK_PROVIDER,
                              60000,
                              25,
                              listener
                      );

                  } catch (Exception ignored) {
                  }
              }

              private void sendLocation(Location location) {

                  android.content.SharedPreferences p =
                          getSharedPreferences("AntiTheftTracker", MODE_PRIVATE);

                  android.content.SharedPreferences activityPrefs =
                          getSharedPreferences(
                                  getPackageName() + "_preferences",
                                  MODE_PRIVATE
                          );

                  String server =
                          activityPrefs.getString("server",
                                  "https://anti-theft-tracker-1.onrender.com");

                  String device =
                          activityPrefs.getString("device", "my-phone");

                  String secret =
                          activityPrefs.getString("secret", "");

                  try {
                      JSONObject json = new JSONObject();

                      json.put("deviceId", device);
                      json.put("secret", secret);
                      json.put("latitude", location.getLatitude());
                      json.put("longitude", location.getLongitude());
                      json.put("accuracy", location.getAccuracy());
                      json.put("timestamp", System.currentTimeMillis());

                      URL url = new URL(server + "/api/location");

                      HttpURLConnection connection =
                              (HttpURLConnection) url.openConnection();

                      connection.setRequestMethod("POST");
                      connection.setRequestProperty("Content-Type", "application/json");
                      connection.setConnectTimeout(15000);
                      connection.setReadTimeout(15000);
                      connection.setDoOutput(true);

                      OutputStream os = connection.getOutputStream();
                      os.write(json.toString().getBytes("UTF-8"));
                      os.close();

                      connection.getResponseCode();
                      connection.disconnect();

                  } catch (Exception ignored) {
                  }
              }

              private void createNotificationChannel() {

                  if (Build.VERSION.SDK_INT >= 26) {

                      NotificationChannel channel =
                              new NotificationChannel(
                                      "tracker",
                                      "Location Tracking",
                                      NotificationManager.IMPORTANCE_LOW
                              );

                      NotificationManager manager =
                              getSystemService(NotificationManager.class);

                      manager.createNotificationChannel(channel);
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();

                  if (locationManager != null) {
                      locationManager.removeUpdates(new LocationListener() {
                          @Override
                          public void onLocationChanged(Location location) {
                          }
                      });
                  }
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          # Add AndroidX dependencies required by the app
          python3 - <<'PY'
          p="app/build.gradle"
          s=open(p).read()
          s=s.replace(
              "    versionName '1.0'\n",
              "    versionName '1.0'\n\n    buildFeatures {\n        buildConfig true\n    }\n"
          )
          s += "\n\ndependencies {\n    implementation 'androidx.core:core:1.15.0'\n}\n"
          open(p,"w").write(s)
          PY

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AntiTheftTracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
